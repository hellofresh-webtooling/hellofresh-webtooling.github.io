name: Deploy naar surge.sh

on:
  push:
    branches:
      - main
    paths:
      - 'laadlijst.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installeer surge
        run: npm install -g surge

      - name: Deploy naar surge.sh
        run: surge laadlijst.html laadlijst-hub-rui.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
